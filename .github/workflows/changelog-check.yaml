name: Changelog Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: changelog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changelog-check:
    name: changelog-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate live PR changelogs, including every queued PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { checkChangelogEvent } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/changelog-gate.ts`).href);
            const result = await checkChangelogEvent(context.payload, context.repo, github);
            core.info(`Validated ${result.pullRequests.length} PR changelog(s).`);
